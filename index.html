<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🌌 星空 · 艺术闯关测试</title>
    <script>
        // 【第一重保险】放在 head 最前面，尽可能早地禁用滚动恢复
        (function() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            // 如果 URL 里有 # 锚点，立即移除
            if (window.location.hash) {
                try {
                    window.location.replace(window.location.pathname + window.location.search);
                } catch(e) {}
            }
            // 【第三重保险】持续监控滚动位置，2秒内强制拉回顶部
            var checkScroll = setInterval(function() {
                if (window.scrollY > 5 || document.documentElement.scrollTop > 5 || document.body.scrollTop > 5) {
                    window.scrollTo(0, 0);
                    document.documentElement.scrollTop = 0;
                    document.body.scrollTop = 0;
                }
            }, 5);
            setTimeout(function() { clearInterval(checkScroll); }, 2000);
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        /* 【第二重保险】彻底抛弃 flex 布局，改用最普通的块级文档流 */
        body {
            background: linear-gradient(145deg, #1a1e2c 0%, #2b2f45 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
            padding: 18px;
            /* 不写 display: flex，不写 min-height: 100vh，不写 align-items */
        }
        .test-card {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: rgba(250, 247, 235, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 48px 48px;
            padding: 32px 28px 42px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0,0,0,0.3);
            border: 1px solid #b8af94;
        }
        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            color: #2d253b;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 3px dashed #b8a88a;
            padding-bottom: 18px;
            margin-bottom: 22px;
            letter-spacing: -0.3px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #4f4460;
            margin-left: 6px;
        }
        .question-block {
            background: #fcf9f0;
            border-radius: 32px;
            padding: 20px 22px 18px;
            margin-bottom: 22px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.10);
            border: 1px solid #d6ccb8;
            transition: 0.2s;
            position: relative;
        }
        .question-block.correct {
            border-left: 8px solid #4f9f7a;
            background: #f2fcf6;
        }
        .question-block.wrong {
            border-left: 8px solid #c0695a;
            background: #fdf4f2;
        }
        .q-title {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .q-num {
            background: #5b4f6b;
            color: #f0ede6;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .q-type {
            font-size: 0.85rem;
            background: #d3c9b8;
            color: #2f2840;
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 500;
        }
        .q-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e1a2a;
            margin: 8px 0 14px 0;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 6px 0 4px;
        }
        .opt-label {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f0ebe0;
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid #d6cbbc;
            transition: all 0.15s;
            cursor: pointer;
            font-size: 1.05rem;
            color: #1f1b2a;
        }
        .opt-label:hover {
            background: #e5ddd0;
            border-color: #b3a58e;
        }
        .opt-label input[type="checkbox"],
        .opt-label input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #6a5d7a;
            flex-shrink: 0;
            cursor: pointer;
        }
        .opt-label input:disabled + span {
            opacity: 0.9;
        }
        .opt-label.correct-option {
            background: #d0ecdc;
            border-color: #3a8a62;
        }
        .opt-label.wrong-option {
            background: #f8dbd6;
            border-color: #b85a4a;
        }
        .opt-label.missed-option {
            background: #f7e5d4;
            border-color: #c98f7a;
            opacity: 0.9;
        }
        .result-badge {
            display: inline-block;
            margin-left: 14px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .badge-correct {
            color: #1f7a4a;
        }
        .badge-wrong {
            color: #b14535;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin: 28px 0 16px;
            gap: 14px;
        }
        .btn {
            background: #dacfc0;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #242033;
            border: 1px solid #b8ad98;
            box-shadow: 0 4px 0 #9b8f7a;
            transition: 0.08s linear;
            cursor: pointer;
            flex: 1 1 auto;
            min-width: 130px;
            letter-spacing: 0.5px;
            background: #ded3c2;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9b8f7a;
        }
        .btn-primary {
            background: #7b6d8a;
            border-color: #5e516b;
            color: #f5f0e6;
            box-shadow: 0 4px 0 #473d50;
        }
        .btn-primary:active {
            box-shadow: 0 1px 0 #473d50;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #9b8f7a;
            pointer-events: none;
        }
        .score-area {
            background: #2d2640;
            border-radius: 60px;
            padding: 16px 24px;
            color: #efeade;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 10px;
            margin-top: 18px;
            border: 1px solid #5b4e6b;
        }
        .score-badge {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .score-number {
            font-size: 2.1rem;
            font-weight: 700;
            background: #443a54;
            padding: 0 18px;
            border-radius: 60px;
            line-height: 1.4;
            color: #f3ede0;
        }
        .rank-box {
            background: #443a54;
            padding: 6px 22px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #f4ede0;
            white-space: nowrap;
        }
        .rank-box span {
            font-weight: 700;
            color: #fadf9e;
        }
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.95rem;
            color: #61586e;
            border-top: 1px solid #cdc2b0;
            padding-top: 20px;
            letter-spacing: 0.4px;
        }
        .reset-area {
            display: flex;
            justify-content: flex-end;
        }
        .btn-reset {
            background: #c7bbac;
            color: #232033;
            padding: 8px 22px;
            font-size: 1rem;
            min-width: 80px;
            flex: 0 1 auto;
            box-shadow: 0 3px 0 #9d907e;
        }
        @media (max-width: 520px) {
            .test-card { padding: 22px 16px; }
            h1 { font-size: 1.7rem; }
            .q-text { font-size: 1.05rem; }
            .opt-label { font-size: 0.95rem; padding: 10px 14px; }
            .btn { padding: 12px 16px; font-size: 1rem; }
            .score-number { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="test-card" id="app">
    <h1>
        🌌 星空 · 闯关
        <small>🎯 梵高·表现主义</small>
    </h1>

    <div id="questionsContainer"></div>

    <div class="action-bar">
        <button class="btn btn-primary" id="submitBtn">✅ 提交答案</button>
        <div class="reset-area">
            <button class="btn btn-reset" id="resetBtn">🔄 重玩</button>
        </div>
    </div>

    <div class="score-area" id="scoreArea">
        <div class="score-badge">
            <span style="font-size:1.2rem;">🏆 得分</span>
            <span class="score-number" id="scoreDisplay">0</span>
            <span style="font-size:1rem;">/ 16</span>
        </div>
        <div class="rank-box" id="rankDisplay">
            <span>🌟</span> 艺术小种子
        </div>
    </div>
    <div class="footer-note">
        ⭐ 绿色边框=答对，红色边框=答错 · 错题不显示答案，可自己再思考
    </div>
</div>

<script>
    (function() {
        // ---------- 题库：星空 · 六大维度 ----------
        const QUESTIONS = [
            { id: 1, type: 'single', text: '《星空》创作于哪个艺术流派兴盛的时期？', options: ['A. 文艺复兴', 'B. 印象派', 'C. 后印象派 / 表现主义先驱', 'D. 立体主义'], answer: [2] },
            { id: 2, type: 'single', text: '这幅画诞生于哪个世纪？', options: ['A. 17世纪', 'B. 18世纪', 'C. 19世纪', 'D. 20世纪'], answer: [2] },
            { id: 3, type: 'multi', text: '关于梵高创作《星空》时的状态，以下哪些是正确的？', options: ['A. 他在法国圣雷米精神病院期间绘制', 'B. 这是他精神相对稳定时的作品', 'C. 他当时深受精神困扰', 'D. 他完全康复后回到荷兰创作'], answer: [0,2] },
            { id: 4, type: 'single', text: '梵高在创作《星空》时，他的绘画风格处于哪个阶段？', options: ['A. 早期写实风格', 'B. 印象派明亮时期', 'C. 晚期表现性、强烈笔触阶段', 'D. 点彩派阶段'], answer: [2] },
            { id: 5, type: 'multi', text: '《星空》画面中包含了哪些元素？', options: ['A. 旋转的星云', 'B. 明亮的月亮与星星', 'C. 一座宁静的教堂', 'D. 燃烧的柏树'], answer: [0,1,2,3] },
            { id: 6, type: 'single', text: '画面中像黑色火焰一样向上窜起的植物是什么？', options: ['A. 向日葵', 'B. 柏树', 'C. 橄榄树', 'D. 松树'], answer: [1] },
            { id: 7, type: 'multi', text: '关于《星空》的技法，以下哪些描述是正确的？', options: ['A. 使用厚涂法（impasto）堆积颜料', 'B. 用短促、旋转的笔触表现运动感', 'C. 完全使用平涂色彩，没有笔触肌理', 'D. 色彩以蓝色和黄色为主形成强烈对比'], answer: [0,1,3] },
            { id: 8, type: 'single', text: '梵高在《星空》中运用的透视法主要是？', options: ['A. 严格的线性透视', 'B. 大气透视', 'C. 主观情感透视（扭曲空间表达情绪）', 'D. 反向透视'], answer: [2] },
            { id: 9, type: 'multi', text: '《星空》的色彩运用特点包括？', options: ['A. 互补色对比（蓝-黄）', 'B. 色彩具有象征意义', 'C. 完全使用黑白灰', 'D. 色彩明亮且富有装饰性'], answer: [0,1] },
            { id: 10, type: 'single', text: '观看《星空》时，大多数观众会产生哪种主要心理感受？', options: ['A. 宁静与安详', 'B. 躁动、旋转与情绪张力', 'C. 冷漠与疏离', 'D. 理性与克制'], answer: [1] },
            { id: 11, type: 'multi', text: '《星空》被广泛认为传达出哪些情感？', options: ['A. 孤独与渴望', 'B. 对宇宙的敬畏', 'C. 内心的狂喜与焦虑', 'D. 彻底的绝望与虚无'], answer: [0,1,2] },
            { id: 12, type: 'single', text: '《星空》现藏于哪个博物馆？', options: ['A. 巴黎卢浮宫', 'B. 伦敦国家美术馆', 'C. 纽约现代艺术博物馆（MoMA）', 'D. 阿姆斯特丹梵高博物馆'], answer: [2] },
            { id: 13, type: 'multi', text: '关于《星空》的历史影响，以下哪些说法正确？', options: ['A. 它成为表现主义绘画的先声', 'B. 它在梵高生前就售出高价', 'C. 它启发了无数后来的艺术家和设计师', 'D. 它被广泛复制，成为流行文化符号'], answer: [0,2,3] },
            { id: 14, type: 'single', text: '《星空》与《蒙娜丽莎》最大的艺术气质差异是？', options: ['A. 前者理性，后者感性', 'B. 前者感性/表现，后者理性/神秘', 'C. 两者都充满愤怒', 'D. 两者都极简'], answer: [1] },
            { id: 15, type: 'multi', text: '以下哪些是《星空》被后世推崇的原因？', options: ['A. 它把个人情感推向视觉中心', 'B. 笔触本身就是情绪的物理记录', 'C. 它完美符合古典透视法则', 'D. 它展现了精神痛苦中的璀璨想象力'], answer: [0,1,3] },
            { id: 16, type: 'single', text: '梵高通过《星空》想要表达的最核心主题是？', options: ['A. 天文科学的精确性', 'B. 人类内在情感与宇宙自然的共鸣', 'C. 法国乡村风景的写实', 'D. 对宗教的虔诚'], answer: [1] }
        ];

        const TOTAL = QUESTIONS.length;

        function getRank(score) {
            if (score >= 13) return { emoji: '🏆', label: '星空小博士' };
            if (score >= 9) return { emoji: '🌟', label: '表现主义小侦探' };
            return { emoji: '🌱', label: '艺术小种子' };
        }

        const container = document.getElementById('questionsContainer');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const rankDisplay = document.getElementById('rankDisplay');

        function renderQuestions() {
            let html = '';
            QUESTIONS.forEach((q, idx) => {
                const qId = `q${idx}`;
                const typeLabel = q.type === 'single' ? '⭐ 单选' : '★★ 多选';
                const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                const nameAttr = q.type === 'single' ? `name="${qId}"` : '';

                html += `<div class="question-block" data-qidx="${idx}" id="block-${idx}">`;
                html += `<div class="q-title"><span class="q-num">${idx+1}</span><span class="q-type">${typeLabel}</span>`;
                html += `<span class="result-badge" id="badge-${idx}"></span>`;
                html += `</div>`;
                html += `<div class="q-text">${q.text}</div>`;
                html += `<div class="options" id="options-${idx}">`;

                q.options.forEach((optText, optIdx) => {
                    const val = String(optIdx);
                    html += `<label class="opt-label" id="optlabel-${idx}-${optIdx}">`;
                    html += `<input type="${inputType}" ${nameAttr} value="${val}" data-q="${idx}" data-opt="${optIdx}">`;
                    html += `<span>${optText}</span>`;
                    html += `</label>`;
                });

                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function getUserSelections() {
            const allInputs = container.querySelectorAll('input[type="radio"], input[type="checkbox"]');
            const selections = {};
            allInputs.forEach(input => {
                const qIdx = parseInt(input.dataset.q, 10);
                if (!selections[qIdx]) selections[qIdx] = [];
                if (input.checked) {
                    selections[qIdx].push(parseInt(input.dataset.opt, 10));
                }
            });
            return selections;
        }

        function getDetailedResult(selections) {
            const result = { score: 0, details: [] };
            for (let i = 0; i < QUESTIONS.length; i++) {
                const q = QUESTIONS[i];
                const userAns = selections[i] || [];
                const correctAns = q.answer.slice().sort();
                const sortedUser = userAns.slice().sort();
                const isCorrect = JSON.stringify(sortedUser) === JSON.stringify(correctAns);
                if (isCorrect) result.score++;
                result.details.push({
                    correct: isCorrect,
                    userAns: userAns.slice(),
                    correctAns: correctAns
                });
            }
            return result;
        }

        function applyResultDetails(details) {
            for (let i = 0; i < details.length; i++) {
                const block = document.getElementById(`block-${i}`);
                const badge = document.getElementById(`badge-${i}`);
                const detail = details[i];
                block.classList.remove('correct', 'wrong');
                if (detail.correct) {
                    block.classList.add('correct');
                    badge.innerHTML = '✅ <span style="color:#1f7a4a;">答对啦</span>';
                } else {
                    block.classList.add('wrong');
                    badge.innerHTML = '❌ <span style="color:#b14535;">再想想</span>';
                }

                const q = QUESTIONS[i];
                const userAns = detail.userAns;
                const correctAns = detail.correctAns;

                for (let optIdx = 0; optIdx < q.options.length; optIdx++) {
                    const label = document.getElementById(`optlabel-${i}-${optIdx}`);
                    if (!label) continue;
                    label.classList.remove('correct-option', 'wrong-option', 'missed-option');
                    const isUserSelected = userAns.includes(optIdx);
                    if (isUserSelected) {
                        if (correctAns.includes(optIdx)) {
                            label.classList.add('correct-option');
                        } else {
                            label.classList.add('wrong-option');
                        }
                    } else {
                        if (correctAns.includes(optIdx)) {
                            label.classList.add('missed-option');
                        }
                    }
                }
            }
        }

        function updateScore(score) {
            scoreDisplay.textContent = score;
            const rank = getRank(score);
            rankDisplay.innerHTML = `<span>${rank.emoji}</span> ${rank.label}`;
        }

        function disableAllInputs(disabled = true) {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => inp.disabled = disabled);
        }

        function handleSubmit() {
            const selections = getUserSelections();
            let allAnswered = true;
            for (let i = 0; i < QUESTIONS.length; i++) {
                if (!selections[i] || selections[i].length === 0) {
                    allAnswered = false;
                    break;
                }
            }
            if (!allAnswered) {
                alert('🧐 还有题目没有作答呢！每道题至少选一个选项再提交吧～');
                return;
            }

            const result = getDetailedResult(selections);
            updateScore(result.score);
            applyResultDetails(result.details);
            disableAllInputs(true);
            submitBtn.disabled = true;
            document.getElementById('scoreArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function handleReset() {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.checked = false;
                inp.disabled = false;
            });
            const blocks = container.querySelectorAll('.question-block');
            blocks.forEach(block => {
                block.classList.remove('correct', 'wrong');
            });
            const badges = container.querySelectorAll('.result-badge');
            badges.forEach(b => b.innerHTML = '');
            const optLabels = container.querySelectorAll('.opt-label');
            optLabels.forEach(label => {
                label.classList.remove('correct-option', 'wrong-option', 'missed-option');
            });
            submitBtn.disabled = false;
            updateScore(0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function init() {
            renderQuestions();
            updateScore(0);
            submitBtn.addEventListener('click', handleSubmit);
            resetBtn.addEventListener('click', handleReset);
        }

        init();
    })();
</script>
</body>
</html>
